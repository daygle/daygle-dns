[package]
name = "daygle-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Daygle DNS server binary"
default-run = "daygle-dns"

[[bin]]
name = "daygle-dns"
path = "src/main.rs"

[dependencies]
daygle-dns-core = { path = "../daygle-dns-core" }
daygle-dns-policy = { path = "../daygle-dns-policy" }
daygle-dns-authoritative = { path = "../daygle-dns-authoritative" }
daygle-dns-recursive = { path = "../daygle-dns-recursive" }
daygle-dns-dot = { path = "../daygle-dns-dot" }
daygle-dns-api = { path = "../daygle-dns-api", default-features = false }
daygle-dns-ml = { path = "../daygle-dns-ml", default-features = false }
hickory-proto.workspace = true
hickory-server.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true

async-trait.workspace = true
arc-swap.workspace = true
ipnet.workspace = true
quinn.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
socket2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true
getrandom.workspace = true
siphasher.workspace = true

[features]
default = ["verifier-onnx"]
# Builds with --no-default-features (the static musl release job) exclude
# the ONNX Runtime dependency: prebuilt ORT binaries are glibc-based, so
# those binaries run the fastText/heuristic backends only.
verifier-onnx = ["daygle-dns-api/verifier-onnx", "daygle-dns-ml/verifier-onnx"]

[dev-dependencies]
tempfile.workspace = true
chrono.workspace = true
toml.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
tokio.workspace = true
hickory-proto.workspace = true
hickory-server.workspace = true
daygle-dns-core = { path = "../daygle-dns-core" }
daygle-dns-authoritative = { path = "../daygle-dns-authoritative" }
daygle-dns-policy = { path = "../daygle-dns-policy" }
reqwest.workspace = true
serde_json.workspace = true
rcgen.workspace = true
