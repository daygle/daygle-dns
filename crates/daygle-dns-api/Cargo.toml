[package]
name = "daygle-dns-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "REST API for configuration, zones, logs and metrics, plus the embedded GUI"

[dependencies]
daygle-dns-core = { path = "../daygle-dns-core" }
daygle-dns-ml = { path = "../daygle-dns-ml", default-features = false }
daygle-dns-authoritative = { path = "../daygle-dns-authoritative" }
daygle-dns-dhcp = { path = "../daygle-dns-dhcp" }
daygle-dns-dot = { path = "../daygle-dns-dot" }
daygle-dns-policy = { path = "../daygle-dns-policy" }
daygle-dns-recursive = { path = "../daygle-dns-recursive" }
daygle-dns-gui = { path = "../daygle-dns-gui" }
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true
arc-swap.workspace = true
parking_lot.workspace = true
tokio-util.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
instant-acme.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tracing.workspace = true
lettre.workspace = true
reqwest.workspace = true
url.workspace = true

[features]
default = ["verifier-onnx"]
# Forwarded: the MiniLM/ONNX verifier backend inside daygle-dns-ml.
verifier-onnx = ["daygle-dns-ml/verifier-onnx"]
