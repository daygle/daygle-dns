name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same branch are cancelled; a fresh push makes an
# in-flight run's verdict obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap hygiene checks: formatting plus the GUI/workspace version sync
  # gate (same script the release workflow enforces, caught at PR time).
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify GUI version is in sync with the workspace
        run: node web/scripts/sync-version.mjs --check

  # The release binary embeds the committed web/dist (the installer never
  # rebuilds the GUI), so a commit that changes web/src without committing
  # the rebuilt bundle would ship a console missing the new features. Rebuild
  # the bundle here and fail when it differs from what is committed.
  gui-bundle:
    name: GUI bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rebuild the console bundle
        working-directory: web
        run: npm ci && npm run build

      - name: Fail when the committed bundle is stale
        run: |
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            git status --short -- web/dist
            echo "::error::web/dist is stale: a fresh build of web/src differs from the committed bundle. Run 'npm run build' in web/ and commit the result."
            exit 1
          fi

      # Only on failure: publish the bundle CI built so it can be downloaded
      # and committed. The Linux build differs from the Windows one.
      - name: Upload the CI-built bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-dist-ci-build
          path: web/dist

  # Every warning is an error so lints cannot silently accumulate.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Unit and integration tests (integration tests spin up real servers on
  # ephemeral ports - no network access or services required).
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Every file under crates/*/tests links its own binary, and with debug
      # info each is ~470 MB: with ~60 of them the runner ran out of disk.
      # Without it they are ~60 MB each. Failing assertions still report
      # their file and line; only full backtraces lose line numbers.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace

  # The Rust tests hold the OpenAPI path table against the router, but they
  # cannot tell a valid OpenAPI document from an invalid one. Build the
  # server, fetch the document it actually serves and check it against the
  # 3.1 schema, so a schema mistake fails here instead of reaching a client
  # generator.
  openapi:
    name: OpenAPI document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build the server
        run: cargo build --locked -p daygle-dns

      # A throwaway instance: no DNS listeners, no recursion, no update
      # checks, auth off, and its database in the runner's temp dir.
      - name: Serve the document
        run: |
          set -eu
          config="$RUNNER_TEMP/openapi-ci.toml"
          cat > "$config" <<EOF
          [server]
          listen = "127.0.0.1"
          port = 0
          udp_enabled = false
          tcp_enabled = false
          reload_enabled = false

          [api]
          listen = "127.0.0.1"
          port = 53800
          auth_required = false
          gui_enabled = false

          [authoritative]
          database = "$RUNNER_TEMP/openapi-ci.db"

          [recursive]
          enabled = false

          [updates]
          enabled = false

          [ai]
          enabled = false
          EOF
          ./target/debug/daygle-dns --config "$config" > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:53800/api/openapi.json -o "$RUNNER_TEMP/openapi.json"; then
              echo "served the document after $attempt attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the server never answered GET /api/openapi.json"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Validate the document
        run: |
          set -eu
          # A venv: Ubuntu's system Python refuses a global install.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --disable-pip-version-check openapi-spec-validator
          "$RUNNER_TEMP/venv/bin/python" -m openapi_spec_validator --schema 3.1 --validation-errors all "$RUNNER_TEMP/openapi.json"

      - name: Stop the server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/server.pid")" || true
          fi
