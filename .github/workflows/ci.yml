name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same branch are cancelled; a fresh push makes an
# in-flight run's verdict obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap hygiene checks: formatting plus the GUI/workspace version sync
  # gate (same script the release workflow enforces, caught at PR time).
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify GUI version is in sync with the workspace
        run: node web/scripts/sync-version.mjs --check

  # Every warning is an error so lints cannot silently accumulate.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Unit and integration tests (integration tests spin up real servers on
  # ephemeral ports - no network access or services required).
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace
