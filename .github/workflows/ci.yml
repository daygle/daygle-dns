name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same branch are cancelled; a fresh push makes an
# in-flight run's verdict obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap hygiene checks: formatting plus the GUI/workspace version sync
  # gate (same script the release workflow enforces, caught at PR time).
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify GUI version is in sync with the workspace
        run: node web/scripts/sync-version.mjs --check

  # The release binary embeds the committed web/dist (the installer never
  # rebuilds the GUI), so a commit that changes web/src without committing
  # the rebuilt bundle would ship a console missing the new features. Rebuild
  # the bundle here and fail when it differs from what is committed.
  gui-bundle:
    name: GUI bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rebuild the console bundle
        working-directory: web
        run: npm ci && npm run build

      - name: Fail when the committed bundle is stale
        run: |
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            git status --short -- web/dist
            echo "::error::web/dist is stale: a fresh build of web/src differs from the committed bundle. Run 'npm run build' in web/ and commit the result."
            exit 1
          fi

      # Only on failure: publish the bundle CI built so it can be downloaded
      # and committed. The Linux build differs from the Windows one.
      - name: Upload the CI-built bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-ci-build
          path: web/dist

  # Every warning is an error so lints cannot silently accumulate.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Unit and integration tests (integration tests spin up real servers on
  # ephemeral ports - no network access or services required).
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace
