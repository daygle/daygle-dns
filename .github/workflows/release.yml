name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# A re-pushed tag must not race itself into a half-published release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one binary published: a glibc build for distro-managed x86_64 hosts
  # (Debian, Ubuntu, Fedora, Arch). Nothing downloads it automatically -
  # install.sh and the console's updater build from source on the host - so
  # it is a ready-made download and the check that the tagged source builds
  # and reports the tagged version. Other platforms build from source.
  build-glibc-x86_64:
    name: Build linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version from release tag
        # Rewrite Cargo.toml + Cargo.lock from the pushed tag (v1.2.7 -> 1.2.7)
        # and propagate it to web/package*.json, so the built binary, the API
        # and the dashboard all report the tagged version.
        run: node scripts/set-version.mjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release -p daygle-dns

      - name: Smoke test
        run: |
          ./target/release/daygle-dns --version
          built="$(./target/release/daygle-dns --version | awk '{print $2}')"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$expected" ]; then
            echo "::error::binary reports $built but tag is $expected"
            exit 1
          fi

      - name: Stage artifact
        run: |
          mkdir -p stage
          cp target/release/daygle-dns stage/daygle-dns-linux-x86_64
          strip stage/daygle-dns-linux-x86_64 || true

      - name: Checksum
        working-directory: stage
        run: sha256sum daygle-dns-linux-x86_64 > daygle-dns-linux-x86_64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: daygle-dns-linux-x86_64
          path: stage/*
          if-no-files-found: error

  # The AI models bundle: platform-independent data shipped with every
  # release so an installed server can refresh its AI models (fastText
  # starter + MiniLM verifier files) from the console without a binary
  # update. Flat contents: manifest.json + whitelisted model files.
  build-models-bundle:
    name: Build AI models bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage bundle
        run: |
          set -eu
          mkdir -p stage
          for f in daygle-starter.bin all-MiniLM-L6-v2-int8.onnx minilm-tokenizer.json minilm-centroids.json README.md; do
            if [ ! -f "models/$f" ]; then echo "::error::models/$f missing"; exit 1; fi
            cp "models/$f" "stage/$f"
          done
          rm stage/README.md

      - name: Generate manifest
        working-directory: stage
        run: |
          set -eu
          {
            printf '{"version":"%s","files":[' "${GITHUB_REF_NAME#v}"
            first=1
            for f in daygle-starter.bin all-MiniLM-L6-v2-int8.onnx minilm-tokenizer.json minilm-centroids.json; do
              sha="$(sha256sum "$f" | cut -d' ' -f1)"
              size="$(stat -c %s "$f")"
              if [ "$first" -eq 0 ]; then printf ','; fi
              printf '{"name":"%s","sha256":"%s","size":%s}' "$f" "$sha" "$size"
              first=0
            done
            printf ']}\n'
          } > manifest.json
          cat manifest.json

      - name: Bundle
        working-directory: stage
        run: |
          tar -czf daygle-dns-models.tar.gz \
            manifest.json daygle-starter.bin all-MiniLM-L6-v2-int8.onnx \
            minilm-tokenizer.json minilm-centroids.json
          sha256sum daygle-dns-models.tar.gz > daygle-dns-models.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: daygle-dns-models-bundle
          path: stage/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    # Both jobs must be in `needs` so their artifacts finish uploading before
    # the release is created.
    needs: [build-glibc-x86_64, build-models-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: stage

      # The action keeps the body an existing release already has and then
      # appends the freshly generated notes to it, so a second run for the
      # same tag - or a release written before this workflow got there -
      # posts the same "Full Changelog" line twice
      # (softprops/action-gh-release#827). Generate notes only while the
      # release has no body of its own; look releases up through the list
      # endpoint because the by-tag one cannot see drafts.
      - name: Generate notes only if the release has none
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\")] | first | .body // \"\"" \
            || true)"
          if [ -n "$(printf '%s' "$existing" | tr -d '[:space:]')" ]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: stage/*
