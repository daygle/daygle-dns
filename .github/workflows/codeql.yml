name: CodeQL

# Replaces GitHub's CodeQL "default setup" so the analysis can be configured
# (see .github/codeql/codeql-config.yml). Default setup must be switched off
# in Settings -> Code security for this workflow's results to be accepted.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new queries run against code that hasn't changed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # All three are analysed from source without a build.
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Same category as default setup, so existing alerts carry over
          # (and alerts in now-ignored test files close) instead of
          # duplicating.
          category: /language:${{ matrix.language }}
