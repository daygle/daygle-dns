# CodeQL configuration for the advanced setup in workflows/codeql.yml.
#
# Test code is excluded: it deliberately uses dummy passwords, plain-HTTP
# requests to in-process servers on 127.0.0.1, and self-signed certificates,
# which CodeQL otherwise reports as critical vulnerabilities.
name: daygle-dns CodeQL config

paths-ignore:
  # Integration tests (crates/<crate>/tests/*.rs).
  - "crates/*/tests/**"
  # Unit-test modules kept in their own file (`#[cfg(test)] mod tests;`).
  - "crates/**/tests.rs"
  # Token storage hashing only (crates/daygle-dns-core/src/auth/token.rs):
  # session and API tokens are 256 bits from the OS CSPRNG, not user-chosen
  # passwords, so a single SHA-256 is the correct storage function - and a
  # password KDF there would add hundreds of milliseconds of CPU to every
  # authenticated request, for a token the caller controls.
  # rust/weak-sensitive-data-hashing classifies the call as password hashing,
  # so that one module is kept out of analysis; the password hashing it warns
  # about stays in auth.rs, fully scanned.
  - "crates/daygle-dns-core/src/auth/token.rs"
