[workspace]
resolver = "2"
members = [
    "crates/daygle-dns-core",
    "crates/daygle-dns-policy",
    "crates/daygle-dns-authoritative",
    "crates/daygle-dns-recursive",
    "crates/daygle-dns-dot",
    "crates/daygle-dns-api",
    "crates/daygle-dns-gui",
    "crates/daygle-dns",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/daygle/daygle-dns"
authors = ["Daygle DNS contributors"]

[workspace.dependencies]
# Hickory DNS (the rebranded continuation of trust-dns)
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }
hickory-server = { version = "0.26", features = [
    "dnssec-ring",
    "tls-ring",
    "https-ring",
    "quic-ring",
    "metrics",
    "testing",
] }
hickory-resolver = { version = "0.26", features = [
    "dnssec-ring",
    "tls-ring",
    "https-ring",
    "quic-ring",
    "webpki-roots",
    "serde",
] }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = "0.26"
rustls = "0.23"
quinn = "0.11"
rustls-pki-types = "1"
rcgen = "0.14"
async-trait = "0.1"
futures-util = "0.3"
bytes = "1"

axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

rusqlite = { version = "0.40", features = ["bundled"] }
ipnet = "2"
base64 = "0.23"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
arc-swap = "1"
parking_lot = "0.12"
rust-embed = "8"
mime_guess = "2"
rand = "0.8"
tempfile = "3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "socks"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
