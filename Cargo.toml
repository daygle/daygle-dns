[workspace]
resolver = "2"
members = [
    "crates/daygle-dns-core",
    "crates/daygle-dns-policy",
    "crates/daygle-dns-authoritative",
    "crates/daygle-dns-recursive",
    "crates/daygle-dns-dot",
    "crates/daygle-dns-api",
    "crates/daygle-dns-gui",
    "crates/daygle-dns-ml",
    "crates/daygle-dns",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.92"  # pinned to the `ort` (ONNX Runtime) MSRV
license = "Apache-2.0"
repository = "https://github.com/daygle/daygle-dns"
authors = ["Daygle DNS contributors"]

[workspace.dependencies]
# Hickory DNS (the rebranded continuation of trust-dns)
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }
hickory-server = { version = "0.26", features = [
    "dnssec-ring",
    "tls-ring",
    "https-ring",
    "quic-ring",
    "metrics",
    "testing",
] }
hickory-resolver = { version = "0.26", features = [
    "dnssec-ring",
    "tls-ring",
    "https-ring",
    "quic-ring",
    "webpki-roots",
    "serde",
] }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = "0.26"
rustls = "0.23"
quinn = "0.11"
rustls-pki-types = "1"
rcgen = "0.14"
async-trait = "0.1"

axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }
socket2 = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

rusqlite = { version = "0.40", features = ["bundled"] }
ipnet = "2"
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
arc-swap = "1"
parking_lot = "0.12"
rust-embed = "8"
rand = "0.10"
regex = "1"
tempfile = "3"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "socks", "query", "form"] }
# AI subsystem: pure-Rust fastText inference (supervised text classification)
fasttext = "0.8"
# AI verifier: all-MiniLM-L6-v2 embeddings via ONNX Runtime (feature-gated:
# daygle-dns-ml/verifier-onnx, default on; excluded from the static musl
# release build because the prebuilt ONNX Runtime binaries are glibc-based).
ort = { version = "2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "ndarray", "tls-rustls"] }
ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
